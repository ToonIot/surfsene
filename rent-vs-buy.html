<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="icon" href="assets/images/favicon.png"><style>body{font-family:Inter,system-ui,"Segoe UI",sans-serif}.gridbg{background-image:linear-gradient(rgba(14,165,233,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,.06) 1px,transparent 1px);background-size:32px 32px}.node.active{border-color:#f97316;background:#fff7ed}.pulse{animation:p 1.8s infinite}@keyframes p{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><title>Rent vs Buy | SURFSENE</title></head><body class="gridbg min-h-screen bg-slate-50 text-slate-900"><header class="border-b bg-white/90 backdrop-blur"><nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-2"><a href="index.html"><img src="assets/images/logo.png" class="h-16 w-auto"></a><a href="index.html#tools" class="rounded-xl border px-4 py-2 text-sm font-black">← กลับหน้าหลัก</a></nav></header><main class="mx-auto max-w-5xl px-5 py-16"><p class="font-black tracking-widest text-orange-500">RENT VS BUY</p><h1 class="mt-2 text-4xl font-black">เปรียบเทียบค่าเช่ากับการซื้อ</h1><div class="mt-8 grid gap-6 lg:grid-cols-2"><form id="f" class="grid gap-4 rounded-[2rem] border bg-white p-6"><label class="font-bold">ราคาซื้อเครื่องมือ<input id="buy" type="number" value="180000" min="1000" class="mt-2 w-full rounded-xl border p-3"></label><label class="font-bold">ค่าเช่าต่อวัน<input id="rent" type="number" value="2350" min="1" class="mt-2 w-full rounded-xl border p-3"></label><label class="font-bold">จำนวนวันต่อครั้ง<input id="days" type="number" value="7" min="1" class="mt-2 w-full rounded-xl border p-3"></label><label class="font-bold">จำนวนครั้งต่อปี<input id="times" type="number" value="4" min="1" class="mt-2 w-full rounded-xl border p-3"></label><label class="font-bold">Calibration + Storage ต่อปี<input id="maint" type="number" value="12000" min="0" class="mt-2 w-full rounded-xl border p-3"></label></form><div id="result" class="rounded-[2rem] bg-slate-950 p-7 text-white"></div></div></main><script>const fmt=n=>new Intl.NumberFormat('th-TH',{maximumFractionDigits:0}).format(n);function calc(){const annualRent=+rent.value*+days.value*+times.value,annualBuy=(+buy.value/5)+(+maint.value),breakDays=(+buy.value)/(+rent.value);const winner=annualRent<annualBuy?'เช่าเหมาะกว่าในสมมติฐานนี้':'ซื้ออาจเหมาะกว่าในสมมติฐานนี้';result.innerHTML=`<p class="text-xs font-black tracking-widest text-orange-400">5-YEAR COST VIEW</p><div class="mt-5 grid grid-cols-2 gap-4"><div class="rounded-xl bg-white/5 p-4"><span class="text-xs text-slate-400">Rent / ปี</span><b class="mt-2 block text-2xl">฿${fmt(annualRent)}</b></div><div class="rounded-xl bg-white/5 p-4"><span class="text-xs text-slate-400">Buy / ปี*</span><b class="mt-2 block text-2xl">฿${fmt(annualBuy)}</b></div></div><div class="mt-5 rounded-xl bg-orange-500/15 p-4"><b>${winner}</b><p class="mt-2 text-sm text-slate-300">จุดเทียบราคาซื้อประมาณ ${fmt(breakDays)} วันเช่า ไม่รวมต้นทุนเงินทุน ความเสี่ยงเสียหาย และ Utilization</p></div><p class="mt-4 text-xs text-slate-500">*ตัดค่าเครื่องมือ 5 ปีแบบเส้นตรง + Calibration/Storage</p>`}f.addEventListener('input',calc);calc();</script><footer class="mt-20 border-t bg-white py-7 text-center text-xs text-slate-500">SURFSENE Prototype • ค่าที่แสดงเป็นข้อมูลจำลองเพื่อสาธิต UX</footer></body></html>
