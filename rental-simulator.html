<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="icon" href="assets/images/favicon.png"><style>body{font-family:Inter,system-ui,"Segoe UI",sans-serif}.gridbg{background-image:linear-gradient(rgba(14,165,233,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,.06) 1px,transparent 1px);background-size:32px 32px}.node.active{border-color:#f97316;background:#fff7ed}.pulse{animation:p 1.8s infinite}@keyframes p{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><title>Rental Cost Simulator | SURFSENE</title></head><body class="gridbg min-h-screen bg-slate-50 text-slate-900"><header class="border-b bg-white/90 backdrop-blur"><nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-2"><a href="index.html"><img src="assets/images/logo.png" class="h-16 w-auto"></a><a href="index.html#tools" class="rounded-xl border px-4 py-2 text-sm font-black">← กลับหน้าหลัก</a></nav></header><main class="mx-auto max-w-5xl px-5 py-16"><p class="font-black tracking-widest text-orange-500">RENTAL COST SIMULATOR</p><h1 class="mt-2 text-4xl font-black">ประมาณค่าเช่าและบริการ</h1><div class="mt-8 grid gap-6 lg:grid-cols-2"><form id="f" class="grid gap-4 rounded-[2rem] border bg-white p-6"><label class="font-bold">เครื่องมือ<select id="product" class="mt-2 w-full rounded-xl border p-3"><option value="2350">Power Quality Analyzer</option><option value="890">Environmental Kit</option><option value="650">IoT Gateway</option></select></label><label class="font-bold">จำนวน<input id="qty" type="number" min="1" max="20" value="1" class="mt-2 w-full rounded-xl border p-3"></label><label class="font-bold">จำนวนวัน<input id="days" type="number" min="1" max="365" value="7" class="mt-2 w-full rounded-xl border p-3"></label><label class="font-bold">บริการ<select id="service" class="mt-2 w-full rounded-xl border p-3"><option value="0">Self-install</option><option value="4500">On-site Installation</option><option value="7500">Site Survey + Installation</option></select></label><label class="font-bold">พื้นที่<select id="delivery" class="mt-2 w-full rounded-xl border p-3"><option value="500">กรุงเทพฯ / ปริมณฑล</option><option value="1200">ภาคกลาง</option><option value="2200">ต่างจังหวัด</option></select></label></form><div id="result" class="rounded-[2rem] bg-slate-950 p-7 text-white"></div></div></main><script>const fmt=n=>new Intl.NumberFormat('th-TH').format(n);function calc(){const rental=+product.value*+qty.value*+days.value,svc=+service.value,ship=+delivery.value,total=rental+svc+ship;result.innerHTML=`<p class="text-xs font-black tracking-widest text-orange-400">ESTIMATE</p><div class="mt-5 grid gap-3 text-sm"><div class="flex justify-between"><span>ค่าเช่า</span><b>฿${fmt(rental)}</b></div><div class="flex justify-between"><span>ติดตั้ง</span><b>฿${fmt(svc)}</b></div><div class="flex justify-between"><span>ขนส่ง</span><b>฿${fmt(ship)}</b></div></div><div class="mt-6 border-t border-white/15 pt-5 flex justify-between text-2xl"><span>รวม</span><b>฿${fmt(total)}</b></div><p class="mt-4 text-xs text-slate-400">ราคา Demo ไม่รวม VAT, Deposit, Calibration พิเศษ และงานหน้างานเพิ่มเติม</p>`}f.addEventListener('input',calc);calc();</script><footer class="mt-20 border-t bg-white py-7 text-center text-xs text-slate-500">SURFSENE Prototype • ค่าที่แสดงเป็นข้อมูลจำลองเพื่อสาธิต UX</footer></body></html>
