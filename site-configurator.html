<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="icon" href="assets/images/favicon.png"><style>body{font-family:Inter,system-ui,"Segoe UI",sans-serif}.gridbg{background-image:linear-gradient(rgba(14,165,233,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(14,165,233,.06) 1px,transparent 1px);background-size:32px 32px}.node.active{border-color:#f97316;background:#fff7ed}.pulse{animation:p 1.8s infinite}@keyframes p{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><title>Site Configurator | SURFSENE</title></head><body class="gridbg min-h-screen bg-slate-50 text-slate-900"><header class="border-b bg-white/90 backdrop-blur"><nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-2"><a href="index.html"><img src="assets/images/logo.png" class="h-16 w-auto"></a><a href="index.html#tools" class="rounded-xl border px-4 py-2 text-sm font-black">← กลับหน้าหลัก</a></nav></header><main class="mx-auto max-w-7xl px-5 py-16"><p class="font-black tracking-widest text-orange-500">VISUAL SITE CONFIGURATOR</p><h1 class="mt-2 text-4xl font-black">ออกแบบเส้นทางข้อมูลของ Site</h1><p class="mt-3 text-slate-600">เลือกประเภท Site และกดอุปกรณ์เพื่อดูสิ่งที่มีอยู่เดิม สิ่งที่เช่า และ Protocol ที่ใช้</p><div class="mt-8 flex flex-wrap gap-2"><button class="site rounded-xl bg-slate-950 px-4 py-3 font-bold text-white" data-v="factory">Factory</button><button class="site rounded-xl border bg-white px-4 py-3 font-bold" data-v="building">Building</button><button class="site rounded-xl border bg-white px-4 py-3 font-bold" data-v="retail">Retail</button></div><div id="canvas" class="mt-8 grid gap-5 rounded-[2rem] border bg-white p-7 shadow-sm md:grid-cols-4"></div><div id="detail" class="mt-5 rounded-2xl bg-slate-950 p-6 text-white"></div></main><script>const maps={factory:[['⚙','Machine / PLC','Existing','OPC UA / Modbus TCP'],['⚡','Power Meter','Rent or Existing','Modbus RTU'],['◈','SURFSENE Gateway','Rental','RS485 / Ethernet / MQTT'],['▦','Dashboard','SURFSENE','Live / History / Alert']],building:[['🌡','Environment Sensor','Rental','RS485'],['⚡','Main Meter','Existing','Modbus RTU'],['◈','Gateway','Rental','Modbus / MQTT'],['▦','Dashboard','SURFSENE','Multi-zone']],retail:[['🔌','Branch Meter','Rent or Existing','Modbus'],['❄','HVAC Sensor','Rental','RS485'],['◈','Gateway','Rental','4G / Ethernet'],['▦','Multi-site','SURFSENE','Branch comparison']]};let active='factory';function render(){canvas.innerHTML=maps[active].map((x,i)=>`<button class="node rounded-2xl border p-5 text-left" data-i="${i}"><span class="text-3xl">${x[0]}</span><b class="mt-3 block">${x[1]}</b><small class="text-slate-500">${x[2]}</small>${i<3?'<div class="mt-4 text-center text-orange-500">→</div>':''}</button>`).join('');canvas.querySelectorAll('.node').forEach(b=>b.onclick=()=>{canvas.querySelectorAll('.node').forEach(x=>x.classList.remove('active'));b.classList.add('active');const x=maps[active][+b.dataset.i];detail.innerHTML=`<b class="text-xl">${x[1]}</b><p class="mt-2 text-slate-300">Ownership: ${x[2]} • Connectivity: ${x[3]}</p>`});canvas.querySelector('.node').click()}document.querySelectorAll('.site').forEach(b=>b.onclick=()=>{active=b.dataset.v;document.querySelectorAll('.site').forEach(x=>x.className='site rounded-xl border bg-white px-4 py-3 font-bold');b.className='site rounded-xl bg-slate-950 px-4 py-3 font-bold text-white';render()});render();</script><footer class="mt-20 border-t bg-white py-7 text-center text-xs text-slate-500">SURFSENE Prototype • ค่าที่แสดงเป็นข้อมูลจำลองเพื่อสาธิต UX</footer></body></html>
